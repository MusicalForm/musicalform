[tox]
requires =
    tox-uv>=1.0
envlist = py311,py312,lint,typecheck
isolated_build = True
skip_missing_interpreters = True

[testenv]
description = Run tests with pytest
deps =
    pytest>=8.0
    pytest-cov>=4.0
    coverage>=7.0
commands =
    pytest {posargs:tests} --cov --cov-report=term-missing

[testenv:lint]
description = Run pre-commit hooks
skip_install = True
deps =
    pre-commit
commands =
    pre-commit run --all-files


[testenv:typecheck]
description = Run type checking (optional, for future use)
skip_install = True
deps =
    mypy>=1.0
commands =
    mypy --ignore-missing-imports .

[testenv:build]
description = Build source distribution and wheel
skip_install = True
deps =
    build>=1.0
commands =
    python -m build

[testenv:publish-test]
description = Upload to TestPyPI
skip_install = True
deps =
    twine>=5.0
passenv =
    TWINE_USERNAME
    TWINE_PASSWORD
commands =
    twine upload --repository testpypi dist/*

[testenv:publish]
description = Upload to PyPI
skip_install = True
deps =
    twine>=5.0
passenv =
    TWINE_USERNAME
    TWINE_PASSWORD
    TWINE_API_TOKEN
commands =
    twine upload dist/*

[flake8]
max-line-length = 120
per-file-ignores = __init__.py:F401
exclude =
    .git,
    __pycache__,
    .tox,
    dist,
    build,
    *.egg-info,
    docs/notebooks,
    docs/conf.py,
    *.ipynb,
    src/musicalform/cli/lcma_standardParser.py
